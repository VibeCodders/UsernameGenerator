<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Username Generator</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <h1>Username Generator</h1>

    <label for="length">Username Length</label>
    <input type="number" id="length" value="8" min="1" max="20" />

    <label for="easyRead">Ease to Read <span class="range-value" id="easyReadValue">70</span></label>
    <input type="range" id="easyRead" value="70" min="1" max="300" />

    <label for="easySay">Ease to Say <span class="range-value" id="easySayValue">70</span></label>
    <input type="range" id="easySay" value="70" min="1" max="300" />

    <div class="actions">
      <button id="generateBtn">Generate Username</button>
      <button id="copyBtn" type="button" title="Copy to clipboard">Copy</button>
    </div>

    <div id="error" class="error"></div>
    <div id="result"></div>
  </div>

  <script src="js/usernameGenerator.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
