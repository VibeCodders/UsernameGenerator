<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Username Generator</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <h1>Username Generator</h1>
      <button
        id="themeToggle"
        type="button"
        class="icon-btn"
        title="Toggle dark mode"
        aria-label="Toggle dark mode"
      >🌙</button>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="length">Length</label>
        <input type="number" id="length" value="8" min="1" max="20" />
      </div>
      <div class="field">
        <label for="count">How many</label>
        <input type="number" id="count" value="5" min="1" max="10" />
      </div>
    </div>

    <label for="style">Style</label>
    <select id="style">
      <option value="plain">Plain</option>
      <option value="numbers">With numbers</option>
      <option value="underscore">With_underscore</option>
      <option value="camelCase">CamelCase</option>
      <option value="leet">L33t speak</option>
    </select>

    <label for="easyRead">Ease to Read <span class="range-value" id="easyReadValue">70</span></label>
    <input type="range" id="easyRead" value="70" min="1" max="300" aria-describedby="easyReadValue" />

    <label for="easySay">Ease to Say <span class="range-value" id="easySayValue">70</span></label>
    <input type="range" id="easySay" value="70" min="1" max="300" aria-describedby="easySayValue" />

    <div class="actions">
      <button id="generateBtn">Generate</button>
    </div>

    <div id="error" class="error" role="alert"></div>

    <ul id="resultList" class="result-list" aria-live="polite"></ul>

    <div class="panel-tabs" role="tablist">
      <button type="button" class="panel-tab active" data-panel="history" role="tab" aria-selected="true">History</button>
      <button type="button" class="panel-tab" data-panel="favorites" role="tab" aria-selected="false">Favorites</button>
    </div>

    <ul id="historyList" class="side-list" data-panel-content="history"></ul>
    <ul id="favoritesList" class="side-list" data-panel-content="favorites" hidden></ul>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/usernameGenerator.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
